name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: build & install (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl

      - name: Import and version check
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import pcb_mcp
          print("pcb_mcp", pcb_mcp.__version__)
          assert pcb_mcp.__version__.startswith("0.17.0"), pcb_mcp.__version__
          PY

      - name: Console entry points resolve
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from importlib.metadata import entry_points
          names = {e.name for e in entry_points(group="console_scripts")}
          for want in ("pcb-design-mcp", "pcb-mcp", "pcb-plan"):
              assert want in names, f"missing entry point: {want}"
          print("entry points ok")
          PY

      - name: No third-party binaries are shipped
        run: |
          if unzip -l dist/*.whl | grep -Ei '\.jar$|\.pdf$'; then
            echo "vendor binaries must not be packaged"; exit 1
          fi
          echo "wheel contains no jar/pdf"